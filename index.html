function rollEventForStage(stage, prob, hasAllHpHappenedToday){
  if(Math.random()>=prob) return null;
  let pool = (stage===1?EVENTS_STAGE1:(stage===2?EVENTS_STAGE2:EVENTS_STAGE3));
  if(hasAllHpHappenedToday){
    pool = pool.filter(e => e.kind !== 'all_hp' || e.amt > 0);
  }
  return pick(pool);
}

function applyEventToPlayers(ev, playersMap){
  let text='', flash=null;
  const unit=(ev.kind.indexOf('hp')>=0)?'HP':'G';
  const dir=ev.amt>=0?'+':'−', mag=Math.abs(ev.amt);
  const aliveEntries=Object.entries(playersMap).filter(([k,p])=>p.alive);

  if(ev.kind==='all_hp'||ev.kind==='all_gold'){
    aliveEntries.forEach(([k,p])=>{
      if(unit==='HP'){
        p.hp=Math.max(0,Math.min(MAX_HP,(p.hp||0)+ev.amt));
        if(p.hp<=0) p.alive=false;
      } else {
        p.gold=Math.max(0,(p.gold||0)+ev.amt);
      }
    });
    text=ev.text+' (전체)';
    flash={ icon:ev.icon, title:ev.title, sub:ev.sub, all:true, dir, mag, unit, name:'전원' };
  } else if(aliveEntries.length){
    const [k,p]=pick(aliveEntries);
    if(unit==='HP'){
      p.hp=Math.max(0,Math.min(MAX_HP,(p.hp||0)+ev.amt));
      if(p.hp<=0) p.alive=false;
    } else {
      p.gold=Math.max(0,(p.gold||0)+ev.amt);
    }
    text=ev.text+' → '+p.name;
    flash={ icon:ev.icon, title:ev.title, sub:ev.sub, targetKey:k, dir, mag, unit, name:p.name };
  }
  return { text, flash };
}

function computeAdaptive(pObj, stage, round){
  const arr=pObj?Object.values(pObj):[];
  const alive=arr.filter(p=>p.alive);
  const total=arr.length||1, n=alive.length||1;
  const avgHP=alive.reduce((s,p)=>s+(p.hp||0),0)/n;
  const aliveRatio=alive.length/total;

  let thirst = (round === 1) ? 0 : BASE_THIRST[stage];
  let waterMul=1, mode='표준', desc='표준 상태', color='bg-slate-600/70';

  if(round >= 5){
    if(aliveRatio < 0.7 || avgHP < 40){
      thirst=Math.max(6, Math.round(thirst * 0.65));
      waterMul=0.7;
      mode='🟢 긴급 완화'; 
      desc='생존 위기 감지 → 갈증 35% 감소 & 물 시작가 할인'; 
      color='bg-emerald-600/80 ring-2 ring-emerald-400 animate-pulse';
    } else if(avgHP > 80 && aliveRatio > 0.95){
      thirst=thirst+2; waterMul=1.15;
      mode='🔴 압박'; desc='전원 여유로움 → 갈증 +2'; color='bg-red-600/70';
    }
  }
  return { thirst, waterMul, mode, desc, color, avgHP:Math.round(avgHP), aliveN:alive.length, total:arr.length };
}

function genCode(){ return String(Math.floor(1000 + Math.random() * 9000)); }

async function startAsHost(){
  try{
    if(!db) return alert("Firebase 초기화에 실패했습니다. 설정을 확인하세요.");
    role='host';
    roomCode=genCode();
    roomRef=db.ref('rooms/'+roomCode);

    await roomRef.set({
      status:'WAITING',
      round:0,
      stage:1,
      market:MARKET[1],
      waterBase:STAGE_WATER_BASE[1],
      lastWater:0,
      thirst:0
    });

    attachListener();
    show('view-host');

    setInterval(()=>{
      if(role!=='host'||!state) return;
      const ci=state.currentItem;
      if(state.status==='PLAYING' && ci && ci.status==='RUNNING'){
        const nextSec = (ci.remainSec !== undefined ? ci.remainSec : 6) - 1;
        if(nextSec <= 0){
          roomRef.child('currentItem/remainSec').set(0);
          finalizeAuction();
        } else {
          roomRef.child('currentItem/remainSec').set(nextSec);
        }
      }
    }, 1000);

  }catch(e){
    console.error(e);
    alert("방 생성 실패: " + e.message);
  }
}

async function joinAsClient(){
  const code=document.getElementById('in-code').value.trim();
  const name=document.getElementById('in-name').value.trim();
  if(!/^\d{4}$/.test(code)) return alert('4자리 룸 코드를 입력하세요.');
  if(!name) return alert('이름을 입력하세요.');

  try{
    const snap=await db.ref('rooms/'+code).get();
    if(!snap.exists()) return alert('존재하지 않는 방입니다. 룸 코드를 다시 확인하세요.');
    if(snap.val().status==='ENDED') return alert('이미 종료된 게임입니다.');

    const pRef=db.ref('rooms/'+code+'/players').push();
    await pRef.set({ name, hp:INIT_HP, gold:INIT_GOLD, alive:true, inv:{water:INIT_WATER,diamond:0}, score:0 });

    role='client'; roomCode=code; myKey=pRef.key; roomRef=db.ref('rooms/'+code);
    localStorage.setItem('player_'+code, JSON.stringify({key:myKey,code}));
    attachListener();
    show('view-client');
  }catch(e){
    console.error(e);
    alert('참가 중 오류: ' + e.message);
  }
}

function attachListener(){
  roomRef.on('value', s=>{
    state=s.val();
    if(!state) return;
    role==='host'?renderHost():renderClient();
  });
}

function startGame(){
  const table={ 1:250, 2:750, 3:15 };
  roomRef.child('marketTable').set(table).then(()=>loadRound(1));
}
function nextRound(){ const nr=state.round+1; if(nr>MAX_ROUND){ endGame(); return; } loadRound(nr); }

function loadRound(round){
  lastEventLotIndex = -2;
  const plan=ROUND_PLAN[round-1], stage=plan.stage, th=STAGE_THEME[stage];
  Promise.all([roomRef.child('players').get(), roomRef.child('marketTable').get()]).then(([snap, mtSnap])=>{
    const mt=mtSnap.val()||MARKET;
    const pObj={};
    if(snap.exists()){
      snap.forEach(c=>{ pObj[c.key]=c.val(); });
    }

    const rawThirst = (round === 1) ? 0 : BASE_THIRST[stage];
    Object.keys(pObj).forEach(k=>{
      if(pObj[k].alive){
        pObj[k].hp = Math.max(0, (pObj[k].hp||0) - rawThirst);
        if(pObj[k].hp <= 0) pObj[k].alive = false;
      }
    });

    const adapt=computeAdaptive(pObj, stage, round);

    if(adapt.thirst < rawThirst){
      const refund = rawThirst - adapt.thirst;
      Object.keys(pObj).forEach(k=>{
        if(pObj[k].alive) pObj[k].hp = Math.min(MAX_HP, (pObj[k].hp||0) + refund);
      });
    }

    let currentDiaMarket = mt[stage];
    if(plan.caravan){
      currentDiaMarket = 700 + Math.floor(Math.random() * 151);
    }

    const queue = (plan.lots || []).map(lotDef => {
      const it = ITEM[lotDef.k];
      const count = lotDef.c || 1;
      const start = Math.max(5, Math.round(lotDef.s * (lotDef.k === 'water' ? adapt.waterMul : 1)));
      const displayName = count > 1 ? `${it.name} ×${count}` : it.name;
      const displayDesc = count > 1 ? `${count}병 묶음 · ${it.desc}` : it.desc;
      return { key: lotDef.k, count, start, name: displayName, icon: it.icon, type: it.type, desc: displayDesc };
    });

    const first = buildCurrentItem(queue[0], 0);

    let evText='', evIcon='', evFlash=null;
    let morningAllHp = false;
    if(round > 1){
      const ev=rollEventForStage(stage, 0.55, false);
      if(ev){
        if(ev.kind === 'all_hp' && ev.amt < 0) morningAllHp = true;
        const r=applyEventToPlayers(ev, pObj);
        evText=r.text; evIcon=ev.icon; evFlash=r.flash;
      }
    }

    roomRef.child('history/d'+round).update({
      round, stage, stageLabel:th.label, diaMarket:currentDiaMarket, morningAllHp
    });

    const guideText = plan.guide || STAGE_GUIDE[stage].txt;

    const applyRoom=()=> roomRef.update({
      status:'PLAYING', round, stage, market:currentDiaMarket, lastWater:0, thirst:adapt.thirst,
      flashEvent:null,
      adapt:{ mode:adapt.mode, desc:adapt.desc, color:adapt.color, avgHP:adapt.avgHP, aliveN:adapt.aliveN, total:adapt.total },
      event:{ round, narr:DAY_NARR[round], stageLabel:th.label, weather:th.weather, thirst:adapt.thirst,
              caravan:!!plan.caravan, diaPrice:currentDiaMarket, guide:guideText, guideBg:STAGE_GUIDE[stage].bg,
              icon:evIcon, rand:evText, evFlash:evFlash||null, dayId:Date.now(), id:Date.now() },
      queue, qIndex:0, currentItem:first
    });

    roomRef.child('players').set(pObj).then(applyRoom);
  });
}

function buildCurrentItem(lot, idx){
  return { key:lot.key, count:lot.count||1, name:lot.name, icon:lot.icon, desc:lot.desc, type:lot.type,
    startBid:lot.start, currentBid:lot.start, highestBidder:"", highestBidderKey:"",
    remainSec:6, maxSec:6, status:'IDLE', lotIndex:idx };
}

function startAuction(){
  const ci=state.currentItem; if(!ci||ci.status!=='IDLE') return; finalizing=false;
  roomRef.child('currentItem').update({ status:'RUNNING', currentBid:ci.startBid, highestBidder:"", highestBidderKey:"", remainSec:6, maxSec:6 });
}
function forcePass(){ const ci=state.currentItem; if(!ci) return; roomRef.child('currentItem').update({status:'PASSED', remainSec:0}); }

function nextItem(){
  const q=state.queue||[]; let i=state.qIndex; if(i>=q.length-1) return; i++;
  roomRef.child('players').get().then(snap=>{
    const pObj={};
    if(snap.exists()) snap.forEach(c=>{ pObj[c.key]=c.val(); });

    let flash=null, evPatch=null;
    const isFirstDayFirstPass = (state.round === 1 && i === 1);

    const canRoll = isFirstDayFirstPass || (i - lastEventLotIndex >= 2);
    const prob = isFirstDayFirstPass ? 1.0 : 0.55;

    const histInfo = (state.history && state.history['d'+state.round]) || {};
    const hasAllHpHappened = !!histInfo.morningAllHp;

    let ev = null;
    if(canRoll){
      ev = rollEventForStage(state.stage, prob, hasAllHpHappened);
    }

    if(ev){
      lastEventLotIndex = i;
      const r=applyEventToPlayers(ev, pObj);
      evPatch={icon:ev.icon, rand:r.text};
      flash=r.flash;
    }
    const doIt=()=>{
      const roomUpd={ qIndex:i, currentItem:buildCurrentItem(q[i],i) };
      if(evPatch){ roomUpd['event/icon']=evPatch.icon; roomUpd['event/rand']=evPatch.rand; roomUpd['event/id']=Date.now(); }
      if(flash){ flash.id=Date.now(); roomUpd['flashEvent']=flash; }
      roomRef.update(roomUpd);
    };
    roomRef.child('players').set(pObj).then(doIt);
  });
}

function endGame(){
  roomRef.child('marketTable').get().then(mtSnap=>{
    const finalDia=(mtSnap.val()||MARKET)[3];
    roomRef.child('players').get().then(snap=>{
      const updates={};
      snap.forEach(c=>{
        const p=c.val(), inv=p.inv||{};
        const diaVal=(inv.diamond||0)*finalDia;
        updates[c.key+'/score']=(p.gold||0)+diaVal;
        updates[c.key+'/_dia']=diaVal;
      });
      roomRef.child('players').update(updates).then(()=>roomRef.child('status').set('ENDED'));
    });
  });
}

function resetGame(){
  if(!confirm('게임을 리셋하시겠습니까? (참가자 유지, 자금·체력·기본물 1병 초기화)')) return;
  lastFlashEvId=0;
  lastFlashId=0;
  lastEventLotIndex = -2;
  roomRef.child('players').get().then(snap=>{
    const updates={};
    snap.forEach(c=>{ updates[c.key]={ name:c.val().name, hp:INIT_HP, gold:INIT_GOLD, alive:true, inv:{water:INIT_WATER,diamond:0}, score:0 }; });
    roomRef.update({ status:'WAITING', round:0, stage:1, market:MARKET[1], waterBase:STAGE_WATER_BASE[1], lastWater:0, thirst:0, adapt:null, event:null, flashEvent:null, queue:null, qIndex:0, currentItem:null, players:Object.keys(updates).length?updates:null, history:null });
  });
}

function finalizeAuction(){
  const ci=state.currentItem; if(!ci||ci.status!=='RUNNING'||finalizing) return; finalizing=true;
  roomRef.child('currentItem/status').set('SETTLING').then(()=>{
    if(ci.highestBidderKey){
      const winPrice = Number(ci.currentBid) || 0;
      const count = Number(ci.count) || 1;
      const unitPrice = Math.round(winPrice / count);

      roomRef.child('players/'+ci.highestBidderKey).transaction(p=>{
        if(!p) return p;
        p.gold=(p.gold||0)-winPrice;
        p.inv=p.inv||{};
        p.inv[ci.key]=(p.inv[ci.key]||0)+count;
        return p;
      }).then(()=>{
        const done=()=> roomRef.child('currentItem/status').set('SOLD').then(()=>finalizing=false);
        if(ci.key==='water'){
          roomRef.child('lastWater').set(winPrice);
          roomRef.child('history/d'+state.round+'/waterBids').push(unitPrice).then(done);
        } else if(ci.key==='diamond'){
          roomRef.child('history/d'+state.round+'/diaBids').push(unitPrice).then(done);
        } else {
          done();
        }
      });
    } else {
      roomRef.child('currentItem/status').set('PASSED').then(()=>finalizing=false);
    }
  });
}

function placeBid(inc){
  const ci=state.currentItem; if(!ci||ci.status!=='RUNNING') return;
  const me=state.players&&state.players[myKey]; if(!me||!me.alive||me.hp<=0) return;
  if(ci.highestBidderKey===myKey) return;

  roomRef.child('currentItem').transaction(cur=>{
    if(!cur||cur.status!=='RUNNING') return;
    if(cur.highestBidderKey===myKey) return;
    const nb=Number(cur.currentBid||cur.startBid||0)+inc;
    if(nb>(me.gold||0)) return;

    cur.currentBid=nb;
    cur.highestBidder=me.name;
    cur.highestBidderKey=myKey;
    cur.remainSec = 4;
    cur.maxSec = 4;
    return cur;
  });
}

function consumeWater(){
  const me=state.players&&state.players[myKey]; if(!me||!me.alive||me.hp<=0) return;
  roomRef.child('players/'+myKey).transaction(p=>{
    if(!p||!p.alive) return p; p.inv=p.inv||{};
    if(!p.inv.water||p.inv.water<=0) return;
    if((p.hp||0)>=MAX_HP) return;
    p.inv.water-=1; p.hp=Math.min(MAX_HP,(p.hp||0)+WATER_HEAL);
    return p;
  });
}

function sellDiamond(){
  const me=state.players&&state.players[myKey]; if(!me||!me.alive||me.hp<=0) return;
  const price=Number(state.market)||0;
  roomRef.child('players/'+myKey).transaction(p=>{
    if(!p) return p; p.inv=p.inv||{};
    if(!p.inv.diamond||p.inv.diamond<=0) return;
    p.inv.diamond-=1; p.gold=(p.gold||0)+price;
    return p;
  });
}

function maybeDayFlash(){
  const ev=state&&state.event; if(!ev||!ev.dayId) return;
  if(ev.dayId===lastFlashId) return; lastFlashId=ev.dayId;
  const f=ev.evFlash; let evLine='';
  if(f){
    const mine=f.all||(myKey&&f.targetKey===myKey);
    const who=f.all?'전원':f.name;
    const color=f.dir==='+'?'text-emerald-300':'text-red-400';
    evLine=(role==='client'&&mine)
      ? `<div class="text-3xl md:text-5xl font-black ${color} mt-4 pop">${f.icon} ${f.title}<br>나 ${f.dir}${f.mag}${f.unit}!</div>`
      : `<div class="text-2xl md:text-4xl font-black ${color} mt-4">${f.icon} ${f.title} · ${who} ${f.dir}${f.mag}${f.unit}</div>`;
  }
  const wrap=document.createElement('div'); wrap.id='dayflash';
  wrap.innerHTML=`<div class="df-hit text-center px-6">
     <div class="text-7xl md:text-9xl mb-2">${ev.weather||'☀️'}</div>
     <div class="text-3xl md:text-6xl font-black">DAY ${ev.round} · ${ev.stageLabel||''}</div>
     ${ev.thirst?`<div class="text-4xl md:text-7xl font-black text-red-400 mt-4">🥵 갈증! HP −${ev.thirst}</div>`:`<div class="text-2xl md:text-4xl font-bold text-emerald-300 mt-4">🌴 여정 시작 (기본 물 1병 지급)</div>`}
     ${ev.caravan?`<div class="text-2xl md:text-5xl font-black text-amber-300 mt-4 pop">🐪 대상 도착! 💎 ${ev.diaPrice}G 폭등!</div>`:''}
     ${evLine}
  </div>`;
  document.body.appendChild(wrap);
  if(ev.thirst){ const v=document.createElement('div'); v.className='redveil on'; document.body.appendChild(v); setTimeout(()=>v.remove(),1300); }
  setTimeout(()=>{ if(wrap.parentNode) wrap.remove(); }, 2000);
}

function maybeEventFlash(){
  const f=state&&state.flashEvent; if(!f||!f.id) return;
  if(f.id===lastFlashEvId) return; lastFlashEvId=f.id;
  const mine=f.all||(myKey&&f.targetKey===myKey);
  const who=f.all?'전원':f.name;
  const up=f.dir==='+', color=up?'text-emerald-300':'text-red-400';
  let big;
  if(role==='client'&&mine)
    big=`<div class="text-8xl mb-3">${f.icon}</div><div class="text-4xl font-black">${f.title}</div><div class="text-6xl font-black ${color} mt-4">나 ${f.dir}${f.mag}${f.unit}!</div>`;
  else if(role==='client')
    big=`<div class="text-7xl mb-3">${f.icon}</div><div class="text-3xl font-black">${f.title}</div><div class="text-2xl font-bold ${color} mt-3">${who} ${f.dir}${f.mag}${f.unit}</div>`;
  else
    big=`<div class="text-8xl md:text-9xl mb-3">${f.icon}</div><div class="text-5xl md:text-6xl font-black">${f.title}</div><div class="text-3xl md:text-5xl font-bold ${color} mt-4">${who} ${f.dir}${f.mag}${f.unit}</div><div class="text-xl opacity-80 mt-2">${f.sub||''}</div>`;
  const wrap=document.createElement('div'); wrap.id='dayflash';
  wrap.innerHTML=`<div class="df-hit text-center px-6">${big}</div>`;
  document.body.appendChild(wrap);
  const v=document.createElement('div'); v.className=(up?'greenveil':'redveil')+' on'; document.body.appendChild(v); setTimeout(()=>v.remove(),1300);
  setTimeout(()=>{ if(wrap.parentNode) wrap.remove(); }, 1800);
}

  const view=document.getElementById('view-client');
  const me=state.players&&state.players[myKey];
  if(!me){ view.innerHTML='<div class="p-8 text-center">연결 정보를 찾을 수 없습니다.</div>'; return; }
  if(state.status==='ENDED'){ view.innerHTML=clientResultHTML(me); return; }
  if(state.status==='WAITING'){
    view.innerHTML=`<div class="min-h-screen flex flex-col items-center justify-center p-8 text-center bg-gradient-to-b from-slate-800 to-slate-900">
      <div class="text-6xl mb-4">⏳</div><h1 class="text-2xl font-black mb-2">${me.name}</h1>
      <p class="text-slate-400">선생님이 게임을 시작하길 기다리는 중...</p>
      <div class="mt-6 bg-slate-800 rounded-2xl px-6 py-4"><div class="text-sm text-slate-400">내 시작 자금 / 가방</div>
      <div class="text-xl font-bold">💰 ${me.gold}G · ❤️ ${me.hp}HP · 💧 1병</div></div></div>`; return;
  }
  if(!me.alive||(me.hp||0)<=0){ view.innerHTML=clientDeadHTML(me); return; }
  maybeDayFlash();
  maybeEventFlash();

  const th=STAGE_THEME[state.stage], ci=state.currentItem||{}, dia=state.market||MARKET[1], q=state.queue||[];
  const isTop=ci.highestBidderKey===myKey, running=ci.status==='RUNNING', cur=ci.currentBid||0;
  const inv=me.inv||{}; const lowHp=(me.hp||0)<=40; const ev=state.event||{};
  const canSellNow=state.stage===2;
  const sec = running ? (ci.remainSec !== undefined ? ci.remainSec : 0) : 0;

  const bid=(inc)=>{ const need=cur+inc, ok=running&&!isTop&&need<=me.gold;
    return `<button onclick="placeBid(${inc})" ${ok?'':'disabled'} class="bidbtn flex-1 py-5 rounded-2xl font-black text-2xl ${ok?'bg-cyan-500 active:bg-cyan-600 cursor-pointer':'bg-slate-700 text-slate-500'}">+${inc}</button>`; };

  view.innerHTML=`
  <div class="min-h-screen flex flex-col bg-gradient-to-b ${th.grad}">
    <div class="p-3 bg-black/30">
      <div class="flex justify-between items-center mb-1">
        <span class="font-black">${me.name} <span class="opacity-70 text-sm">· ${th.weather} DAY ${state.round}</span></span>
        <span class="text-yellow-300 font-black">💰 ${(me.gold||0).toLocaleString()}G</span>
      </div>
      <div class="w-full h-5 bg-slate-800 rounded-full overflow-hidden ${lowHp?'hpflash':''}">
        <div class="hpbar h-full ${me.hp>50?'bg-green-400':me.hp>20?'bg-yellow-400':'bg-red-500'}" style="width:${Math.max(0,me.hp)}%"></div>
      </div>
      <div class="text-right text-sm mt-1">❤️ ${me.hp}/${MAX_HP} HP</div>
    </div>

    <div class="${ev.guideBg||'bg-black/40'} mx-3 mt-2 rounded-xl px-3 py-2 text-center text-sm font-bold">${ev.guide||''}</div>
    ${ev.rand?`<div class="mx-3 mt-2 bg-fuchsia-800/60 rounded-xl px-3 py-2 text-sm text-center">${ev.icon||''} ${ev.rand}</div>`:''}
    ${canSellNow&&inv.diamond>0?`<div class="mx-3 mt-2 bg-amber-400 text-black rounded-xl px-3 py-2 text-center font-black pop">🐪 대상 도착! 아래 [💎 팔기]를 눌러 ${dia}G로 환전하세요!</div>`:''}

    <div class="flex-1 p-4 flex flex-col items-center justify-center text-center">
      <div class="text-8xl mb-1 ${running?'pulse-ring':''}">${ci.icon||'❓'}</div>
      <div class="text-3xl font-black">${ci.name||'준비 중'}</div>
      <div class="text-sm opacity-90 my-2 px-4">${ci.desc||''}</div>
      <div class="w-full bg-black/40 rounded-2xl p-4 mb-2">
        <div class="text-sm opacity-80">현재 최고 입찰가</div>
        <div class="text-5xl font-black text-yellow-300">${cur.toLocaleString()}G</div>
        <div class="mt-1 font-bold">${ci.highestBidder?'🙋 '+ci.highestBidder:'<span class="opacity-60">입찰자 없음</span>'}</div>
      </div>
      <div class="text-lg font-bold">⏱ ${running ? sec + '초' : '대기'}</div>
      ${isTop?`<div class="mt-2 px-4 py-1 rounded-xl bg-green-500 font-black animate-pulse">🔥 현재 최고 입찰 중!</div>`:''}
      ${ci.status==='SOLD'?(isTop?`<div class="mt-2 text-emerald-100 font-black text-xl">🎉 낙찰 성공!</div>`:`<div class="mt-2 opacity-90 text-sm">🔨 ${ci.highestBidder||'유찰'} 낙찰</div>`):''}
      ${!running&&ci.status!=='SOLD'&&ci.status!=='PASSED'?`<div class="mt-2 opacity-80 text-xs">경매 시작을 기다리세요</div>`:''}
    </div>

    <div class="px-3 flex gap-2 mb-2">${bid(10)}${bid(50)}${bid(100)}</div>

    <div class="bg-black/40 p-3 grid grid-cols-2 gap-2 text-sm">
      <button onclick="consumeWater()" ${inv.water>0&&me.hp<MAX_HP?'':'disabled'} class="actbtn py-4 rounded-xl font-bold ${inv.water>0&&me.hp<MAX_HP?'bg-sky-500 active:bg-sky-600 cursor-pointer':'bg-slate-700 text-slate-500'}">💧 물 마시기 (${inv.water||0}) +${WATER_HEAL}</button>
      <button onclick="sellDiamond()" ${inv.diamond>0?'':'disabled'} class="actbtn py-4 rounded-xl font-bold ${inv.diamond>0?(canSellNow?'bg-amber-400 active:bg-amber-500 text-black flash cursor-pointer':'bg-amber-600 active:bg-amber-700 text-black cursor-pointer'):'bg-slate-700 text-slate-500'}">💎 팔기 (${inv.diamond||0}) → ${dia}G</button>
    </div>
  </div>`;
}

function clientDeadHTML(me){
  return `<div class="min-h-screen flex flex-col items-center justify-center p-8 text-center bg-gradient-to-b from-slate-900 to-black">
    <div class="text-8xl mb-4">💀</div><h1 class="text-3xl font-black mb-2 text-red-400">탈락하셨습니다</h1>
    <p class="text-slate-400 mb-1">생존 실패 (HP 0)</p>
    <p class="text-slate-500 text-sm">물을 확보·소비하지 못해 사막에서 쓰러졌습니다.</p>
    <div class="mt-6 bg-slate-800 rounded-2xl px-6 py-4 opacity-70"><div class="font-bold">${me.name}</div>
    <div class="text-sm mt-1">최종 보유 💰 ${me.gold}G · 💎 ${(me.inv&&me.inv.diamond)||0}개</div></div>
    <p class="mt-6 text-slate-500 text-sm">순위에서 제외됩니다. 결과를 기다려 주세요...</p></div>`;
}

function rankPlayers(players){ return players.map(([k,p])=>({...p,_k:k})).sort((a,b)=>(b.alive-a.alive)||(b.score-a.score)); }

function resultHTML(players,isHost){
  const finalDia=(state.marketTable&&state.marketTable[3])||MARKET[3];
  const ranked=rankPlayers(players), medal=['🥇','🥈','🥉'];
  const survivors=ranked.filter(p=>p.alive&&p.hp>0);
  return `
  <div class="min-h-screen bg-gradient-to-b from-indigo-900 to-slate-900 p-6 overflow-y-auto">
    <h1 class="text-4xl font-black text-center mb-1">🏆 최종 결과</h1>
    <p class="text-center text-slate-400 mb-6">생존자 중 <b class="text-yellow-300">보유 자산(현금+다이아)</b>이 가장 많은 사람이 우승 · 탈락자는 순위 제외</p>
    
    <div class="max-w-3xl mx-auto space-y-2 mb-8">
      ${ranked.map((p,i)=>{ const rank=survivors.indexOf(p); return `
        <div class="flex items-center gap-3 rounded-2xl p-4 ${rank===0&&p.alive?'bg-yellow-500/20 ring-2 ring-yellow-400':'bg-black/40'} ${!p.alive?'opacity-60':''}">
          <div class="text-3xl w-12 text-center">${p.alive?(medal[rank]||(rank+1)):'💀'}</div>
          <div class="flex-1"><div class="text-xl font-black">${p.name} ${!p.alive?'<span class="text-red-400 text-sm">(탈락·순위제외)</span>':''}</div>
            <div class="text-xs text-slate-300">💰 현금 ${p.gold} · 💎 다이아 잔존가치 ${p._dia||0} (${(p.inv&&p.inv.diamond)||0}개×${finalDia}G)</div></div>
          <div class="text-2xl font-black text-yellow-300">${p.alive?(p.score||0).toLocaleString():'-'}</div>
        </div>`; }).join('')}
    </div>

    <!-- Day별 실제 낙찰가 그래프 -->
    <div class="max-w-3xl mx-auto bg-black/50 rounded-2xl p-6 mb-8 border border-slate-700">
      <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
        <h2 class="text-2xl font-black">📈 10일간의 실제 단위당 낙찰가 추이</h2>
        <span class="px-3 py-1 bg-purple-600/80 rounded-full text-xs font-bold">1개/1병 기준 실제 체결가</span>
      </div>
      
      <div class="grid grid-cols-3 gap-2 my-3 text-center text-xs font-black">
        <div class="p-2 rounded-xl bg-emerald-950/80 border border-emerald-500/50 text-emerald-300">
          🌴 1구간: 오아시스 & 기습폭풍<br><span class="text-[10px] font-normal opacity-80">💎 다이아 고가 / 💧 물의 가치 각인</span>
        </div>
        <div class="p-2 rounded-xl bg-amber-950/80 border border-amber-500/50 text-amber-300">
          🐪 2구간: 가뭄·대상 (D3, D5, D8)<br><span class="text-[10px] font-normal opacity-80">💎 750G 매각 환전 / 💧 물값 상승</span>
        </div>
        <div class="p-2 rounded-xl bg-red-950/80 border border-red-500/50 text-red-300">
          🌪️ 3구간: 본격 모래폭풍 (D6, D9~D10)<br><span class="text-[10px] font-normal opacity-80">💧 물값 폭등 / 💎 다이아 폭락</span>
        </div>
      </div>

      <div class="w-full h-72 md:h-84 relative">
        <canvas id="chart-market"></canvas>
      </div>
    </div>

    <div class="max-w-3xl mx-auto bg-black/40 rounded-2xl p-6 border border-slate-700">
      <h2 class="text-xl font-black mb-4">🎓 수업 마무리 · 핵심 발문</h2>
      <ol class="space-y-4 list-decimal list-inside text-slate-200">
        <li><b>오아시스와 모래폭풍, 물 낙찰가는 왜 이렇게 역전되었을까?</b>
          <p class="text-sm text-slate-400 mt-1 ml-5">→ 한계효용의 차이. 물이 풍족할 때는 추가 1병의 효용이 0에 가깝지만, 목숨이 위태로울 때는 추가 1병의 효용이 무한대에 가깝다.</p></li>
        <li><b>사막에서 다이아몬드 낙찰가가 결국 폭락한 이유는?</b>
          <p class="text-sm text-slate-400 mt-1 ml-5">→ 상대적 희소성과 생존 효용. 아무리 절대량이 적고 귀한 보석이라도, 생존할 수 없는 환경에서는 교환가치를 상실한다.</p></li>
        <li><b>우승자는 다이아를 '언제' 팔았을까? 진 사람은 무엇을 놓쳤을까?</b>
          <p class="text-sm text-slate-400 mt-1 ml-5">→ 기회비용과 리스크 관리. 대상이 왔을 때 최고가로 현금화하고, 생존(물)을 확보한 상태에서 이윤을 남겨야 진정한 승자다.</p></li>
      </ol>
    </div>
    ${isHost?`<div class="text-center mt-6"><button onclick="resetGame()" class="px-8 py-3 rounded-xl bg-slate-700 hover:bg-slate-600 font-bold cursor-pointer">🔄 새 게임</button></div>`:''}
  </div>`;
}

function drawResultChart(){
  setTimeout(()=>{
    const cvs=document.getElementById('chart-market');
    if(!cvs) return;
    const ctx=cvs.getContext('2d');
    const hist=state.history||{};
    const labels=[];
    const waterData=[];
    const diaData=[];

    for(let d=1; d<=MAX_ROUND; d++){
      const info=hist['d'+d]||{};
      const stageName=STAGE_THEME[info.stage||1].label;
      labels.push(`Day ${d} (${stageName})`);

      let wVal = null;
      if(info.waterBids){
        const bids=Object.values(info.waterBids).map(Number).filter(n=>!isNaN(n));
        if(bids.length) wVal = Math.round(bids.reduce((a,b)=>a+b,0)/bids.length);
      }
      waterData.push(wVal);

      let dVal = null;
      if(info.diaBids){
        const bids=Object.values(info.diaBids).map(Number).filter(n=>!isNaN(n));
        if(bids.length) dVal = Math.round(bids.reduce((a,b)=>a+b,0)/bids.length);
      }
      diaData.push(dVal);
    }

    new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          {
            label: '💧 식수 1병당 실제 평균 낙찰가 (G)',
            data: waterData,
            borderColor: '#38bdf8',
            backgroundColor: 'rgba(56, 189, 248, 0.25)',
            borderWidth: 3.5,
            fill: false,
            tension: 0.2,
            spanGaps: true,
            pointRadius: 6,
            pointHoverRadius: 8,
            pointBackgroundColor: '#38bdf8',
            yAxisID: 'y'
          },
          {
            label: '💎 다이아 1개당 실제 평균 낙찰가 (G)',
            data: diaData,
            borderColor: '#facc15',
            backgroundColor: 'rgba(250, 204, 21, 0.25)',
            borderWidth: 3.5,
            fill: false,
            tension: 0.2,
            spanGaps: true,
            pointRadius: 6,
            pointHoverRadius: 8,
            pointBackgroundColor: '#facc15',
            yAxisID: 'y'
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: 'index',
          intersect: false,
        },
        plugins: {
          legend: { 
            position: 'top',
            labels: { color: '#ffffff', font: { size: 13, weight: 'bold' }, padding: 15 } 
          },
          tooltip: {
            backgroundColor: 'rgba(15, 23, 42, 0.95)',
            titleFont: { size: 14, weight: 'bold' },
            bodyFont: { size: 13 },
            padding: 12,
            borderColor: '#475569',
            borderWidth: 1,
            callbacks: {
              label: function(context) {
                const val = context.parsed.y;
                return context.dataset.label + ': ' + (val !== null ? val + 'G' : '경매 없음/유찰');
              }
            }
          }
        },
        scales: {
          x: { 
            ticks: { color: '#cbd5e1', font: { weight: 'bold' } }, 
            grid: { color: 'rgba(255,255,255,0.08)' } 
          },
          y: { 
            title: { display: true, text: '개당/병당 낙찰가 (G)', color: '#94a3b8' },
            ticks: { color: '#cbd5e1' }, 
            grid: { color: 'rgba(255,255,255,0.08)' },
            beginAtZero: true
          }
        }
      }
    });
  }, 100);
}

function clientResultHTML(me){
  const ranked=rankPlayers(Object.entries(state.players));
  const survivors=ranked.filter(p=>p.alive&&p.hp>0);
  const myRank=survivors.findIndex(p=>p._k===myKey)+1;
  return `<div class="min-h-screen bg-gradient-to-b from-indigo-900 to-slate-900 p-6 text-center overflow-y-auto">
    <div class="text-6xl mb-3">${me.alive?(myRank===1?'🥇':'🎉'):'💀'}</div>
    <h1 class="text-2xl font-black mb-1">${me.name}</h1>
    <div class="text-lg mb-4">${me.alive?`최종 <b class="text-yellow-300">${myRank}위</b> / 생존자 ${survivors.length}명`:'생존 실패 (순위 제외)'}</div>
    <div class="bg-black/40 rounded-2xl p-5 max-w-sm mx-auto mb-6"><div class="text-4xl font-black text-yellow-300">${me.alive?(me.score||0).toLocaleString()+'점':'탈락'}</div>
    <div class="text-xs text-slate-300 mt-2">💰 ${me.gold} · 💎 ${(me.inv&&me.inv.diamond)||0}개</div></div>
    <p class="text-slate-400 text-sm">선생님 화면에서 전체 순위와<br/>학습 정리를 확인하세요!</p></div>`;
}
</script>
</body>
</html>
